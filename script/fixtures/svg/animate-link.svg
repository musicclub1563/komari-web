<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24">
  <a id="set-target" href="#safe">
    <set attributeName="href" to="javascript:window.__pwned='set-animate'" begin="0s" />
    <animate attributeName="href" values="javascript:window.__pwned='animate';#safe" dur="0.2s" repeatCount="indefinite" />
    <rect width="24" height="24" fill="#f59e0b" />
  </a>
</svg>
